name: reverseGTAA monthly

on:
  schedule:
    # 05:17 UTC = 07:17 Berlin. US-Vortages-Close liegt bei Yahoo laengst vor.
    # Ungerade Minute senkt die GitHub-Actions-Warteschlange (B3).
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write          # B8: Actions duerfen sonst nicht pushen

concurrency:               # B7: keine ueberlappenden Laeufe
  group: reversegtaa-signal
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas yahooquery numpy pandas_market_calendars

      - name: Run first attempt
        run: |
          rm -f message.txt
          python3 main.py

      - name: Retry loop (safety, B2/B9)
        run: |
          for attempt in 1 2; do
            NEEDS_RETRY=$(python3 - <<'PY'
          import json, os
          f = "status_reversegtaa.json"
          print("true" if (os.path.exists(f) and json.load(open(f)).get("needsRetry")) else "false")
          PY
          )
            echo "Attempt $attempt: needsRetry=$NEEDS_RETRY"
            [ "$NEEDS_RETRY" != "true" ] && echo "Daten frisch." && break
            echo "Warte 30 Min..."; sleep 1800
            rm -f message.txt; python3 main.py
          done

      - name: Send Discord notification
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "DISCORD_WEBHOOK_URL fehlt."; exit 1; fi
          if [ ! -f message.txt ]; then echo "Keine message.txt."; exit 0; fi
          MESSAGE=$(cat message.txt)
          if [ -z "$MESSAGE" ]; then echo "message.txt leer."; exit 0; fi
          MESSAGE="${MESSAGE:0:1900}"
          jq -n --arg content "$MESSAGE" '{content: $content}' > payload.json
          curl --fail-with-body -sS -X POST -H "Content-Type: application/json" \
               -d @payload.json "$DISCORD_WEBHOOK_URL"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && echo "Nichts zu committen" && exit 0
          git commit -m "Update signals [ci skip]"
          git pull --rebase origin main
          git push origin main
